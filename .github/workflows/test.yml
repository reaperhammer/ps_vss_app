name: tests

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main, 'feature/**' ]

permissions:
  contents: read

jobs:
  test:
    name: Pester (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PowerShell
        uses: microsoft/setup-powershell@v1
        with:
          psVersion: '7.4'

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser -MinimumVersion 5.7.0
          Import-Module Pester -MinimumVersion 5.7.0 -Force
          $pester = Get-Module -ListAvailable Pester | Sort-Object Version -Descending | Select-Object -First 1
          Write-Host "Using Pester $($pester.Version)"

      - name: Run tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = "./tests/main.Tests.ps1"
          $config.Output.Verbosity = "Detailed"
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = "./tests/TestResults.xml"
          $config.Run.Exit = $false
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) {
              Write-Host "`n::error::$($result.FailedCount) test(s) failed"
              exit 1
          }
          Write-Host "`nAll $($result.PassedCount) test(s) passed"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: tests/TestResults.xml
          if-no-files-found: warn

      - name: Build VssBackupHelper.exe
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $csc = Join-Path $env:SystemRoot "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) {
            $csc = Join-Path $env:SystemRoot "Microsoft.NET\Framework\v4.0.30319\csc.exe"
          }
          if (-not (Test-Path $csc)) {
            Write-Host "::warning::csc.exe not found; skipping VssBackupHelper.exe build"
            exit 0
          }
          New-Item -ItemType Directory -Path bin -Force | Out-Null
          & $csc /target:exe /optimize /out:bin/VssBackupHelper.exe VssBackupHelper.cs
          if (-not (Test-Path bin/VssBackupHelper.exe)) {
            Write-Host "::error::Failed to build VssBackupHelper.exe"
            exit 1
          }
          Write-Host "Built bin/VssBackupHelper.exe ($((Get-Item bin/VssBackupHelper.exe).Length) bytes)"

      - name: Upload VssBackupHelper.exe
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: VssBackupHelper-exe-${{ matrix.os }}
          path: bin/VssBackupHelper.exe
          if-no-files-found: warn

  release:
    name: Publish release artifacts
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download VssBackupHelper.exe
        uses: actions/download-artifact@v4
        with:
          name: VssBackupHelper-exe-windows-latest
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VssBackupHelper.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
